services:
  - type: web
    name: rptpfr-stats
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: TRUCKY_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.7
